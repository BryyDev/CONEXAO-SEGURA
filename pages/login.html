<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Permite exibir corretamente acentos e caracteres especiais. -->
    <meta charset="UTF-8">

    <!-- Ajusta a largura da página ao dispositivo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Caminho relativo à localização deste HTML. -->
    <link rel="stylesheet" href="../css/login.css">
    

    <title>Login</title>
</head>

<body>
    <!-- Conteúdo principal da página. -->
    <main class="container">
        <!--
            Mantido o destino original.
            action="formulario" aponta para uma rota chamada formulario;
            isso, sozinho, não implementa o processamento dos dados.
        -->
        <form action="formulario">
            <!-- Caixa principal do formulário. -->
            <div class="pai-de-todos">
                <!-- Agrupa os campos do formulário. -->
                <div class="inputs">
                    <div class="nome">
                        <label for="nome">Nome</label>
                        <!-- Cada campo tem sua própria referência para posicionar o ícone. -->
                        <div class="input">
                            <!-- O caminho parte de pages; alt vazio indica um ícone decorativo. -->
                            <img src="../assets/create-account-screen/Name.svg" alt="">
                            <input type="text" id="nome" name="nome" placeholder="Insira seu nome" autocomplete="name">
                        </div>
                    </div>
                    <div class="input-email">
                        <label for="email">Email</label>
                        <div class="input email">
                            <img src="../assets/create-account-screen/Email.svg" alt="">
                            <input type="email" id="email" name="email" placeholder="Insira seu Email" autocomplete="email">
                        </div>
                    </div>
                    <div class="input-senha">
                        <label for="password">Senha</label>
                        <div class="input senha">
                            <img src="../assets/create-account-screen/Lock.svg" alt="">
                            <input type="password" id="password" name="password" placeholder="Insira sua senha" autocomplete="current-password">
                        </div>
                    </div>
                </div>
            </div>
            <div class="lembrar-senha">
                <label>
                    <input type="checkbox" name="checkbox" id="senha lembrar">
                    Lembrar de mim
                </label>
                <a href="#">Esqueci senha</a>
            </div>
            <button class="entrar" type="submit"> Entrar</button>
            <button class="entrar-google" type="submit">Entrar com Google</button>
            <button class="criar-conta" type="submit">Criar conta</button>
        </form>
    </main>
</body>

</html>
