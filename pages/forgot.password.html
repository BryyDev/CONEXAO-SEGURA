<!doctype html> <!-- Declara que o documento utiliza HTML5. -->
<html lang="pt-br"> <!-- Inicia o documento e define seu idioma como português do Brasil. -->
  <head> <!-- Inicia a seção de metadados e recursos da página. -->
    <meta charset="UTF-8" /> <!-- Define a codificação UTF-8 para exibir corretamente acentos e outros caracteres. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Ajusta a largura da área de visualização à do dispositivo e define a escala inicial como 1. -->
    <link rel="shortcut icon" href="../assets/create-account-screen/logo.svg" type="image/svg+xml" /> <!-- Usa o logo do projeto como ícone da aba e informa corretamente seu formato SVG. -->
    <link rel="stylesheet" href="../css/forgot.passwoed.css" /> <!-- Carrega os estilos da tela de recuperação de senha. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Prepara a conexão com o servidor de estilos do Google Fonts. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <!-- Prepara a conexão entre origens com o servidor dos arquivos de fontes. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" /> <!-- Carrega a fonte Inter nos pesos regular, negrito e extranegrito usados no layout. -->
    <title>Recuperar senha | Conexão Segura</title> <!-- Identifica a tela de recuperação de senha na aba do navegador. -->
  </head> <!-- Encerra a seção de metadados e recursos. -->
  <body> <!-- Inicia o conteúdo visível da página. -->
    <main class="container" aria-label="Recuperação de senha"> <!-- Cria o cartão principal e fornece um nome acessível para essa região. -->
      <form aria-label="Recuperar acesso à conta"> <!-- Agrupa os elementos da recuperação de acesso, sem integração com um servidor. -->
        <div class="imgDiv"> <!-- Reserva o espaço do logo no topo do cartão. -->
          <a href="../index.html" aria-label="Conexão Segura: ir para a tela de login"> <!-- Transforma o logo em um link para a página inicial de login. -->
            <img src="../assets/create-account-screen/logo.svg" alt="Logo Conexão Segura" width="124" height="67" /> <!-- Reutiliza o logo do projeto nas dimensões de 124 por 67 pixels indicadas no Figma. -->
          </a> <!-- Encerra o link do logo. -->
        </div> <!-- Encerra o grupo do logo. -->
        <div class="containerr"> <!-- Agrupa o conteúdo do campo de e-mail. -->
          <div class="inputEmail"> <!-- Organiza o rótulo e a entrada de e-mail em uma coluna. -->
            <label for="email">Email:</label> <!-- Exibe o rótulo e o associa ao campo com o id email. -->
            <div class="input"> <!-- Cria a referência de posicionamento para o ícone do campo. -->
              <img src="../assets/create-account-screen/Email.svg" alt="" width="20" height="20" /> <!-- Reutiliza o ícone decorativo de e-mail do projeto, com 20 por 20 pixels. -->
              <input id="email" name="email" type="email" autocomplete="email" placeholder="Insira seu e-mail" required /> <!-- Cria o campo obrigatório de e-mail com preenchimento automático e o texto de orientação do Figma. -->
            </div> <!-- Encerra o contêiner do ícone e da entrada de e-mail. -->
          </div> <!-- Encerra o grupo inputEmail. -->
        </div> <!-- Encerra o grupo de conteúdo containerr. -->
        <div class="btoes"> <!-- Agrupa o botão de recuperação para aplicar sua largura e seus estilos. -->
          <button class="btnverde" type="button">Enviar link de recuperação de senha</button> <!-- Exibe o botão do Figma; o tipo button mantém esta etapa apenas visual, sem enviar o formulário. -->
        </div> <!-- Encerra o grupo do botão. -->
        <a class="login-link" href="../index.html">voltar para tela de login</a> <!-- Adiciona o link de retorno ao login exibido abaixo do botão no Figma. -->
      </form> <!-- Encerra o formulário de recuperação de acesso. -->
    </main> <!-- Encerra o cartão principal. -->
  </body> <!-- Encerra o conteúdo visível da página. -->
</html> <!-- Encerra o documento HTML. -->
