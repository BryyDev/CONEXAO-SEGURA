<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 I Conexão Segura</title>

    <link rel="stylesheet" href="../css/404.css">

</head>

<body>

    <!-- Aqui eu vou Criar o conteúdo principal da pagina, e vou 
        dicionar a animação também -->

    <main class="error-page">
        <!-- Aqui estou criando o fundo decorativo -->

        <div class="background-glow"></div>
        <div class="stars"></div>
        <div class="map-lines"></div>

        <!-- Agora vou adicionar o coteúdo principal da tela -->

        <section class="error-content">

            <!-- Nossa logo oficial -->

            <a href="../index.html" class="logo">
                <img src="../assets/error404/logo.svg"
                    alt="Conexão Segura">

            </a>

            <!-- Nosso código erro -->

            <h1 class="error-code">404</h1>

            <!-- A mensagem que irá aparecer quando der erro -->

            <h2>Ops! Este caminho não existe.</h2>

            <p class="description">
                A página que você procura pode ter sido movida,
                removida ou o endereço pode estar incorreto.
            </p>

            <!-- Aqui estou criando as ações 
            que o úsuario vai poder tomar diante da pagina error -->

            <div class="button">

                <a href="../index.html" class="btn btn-primay">
                    Voltar para o ínicio
                </a>

                <a href="mapa" class="btn btn-secondary">
                    Explorar Mapa
                </a>

            </div>

        </section>

        <!-- Fazendo decorações do site -->

        <div class="road">
            <div class="road-line"></div>

            <span class="road-marker"></span>

            <span class="road-help"></span>

        </div>

        <!-- Elementos de iluminação da tela -->

        <div class="light-curves"></div>

        <!-- Rodapé do nosso site -->

        <footer class="footer">
            <span>@ Conexão Segura</span>

            <span>Seu caminho, sua segurança.</span>
        </footer>

    </main>

    <script src="../js/404.js"></script>
</body>

</html>
