<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../assets/create-account-screen/logo.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../css/creacteAccount.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Conexão Segura</title>
  </head>
  <body>
    <main class="container">
      <form>
        <div class="imgDiv">
          <img
            src="../assets/create-account-screen/logo.svg"
            alt="Logo Conexão Segura"
          />
        </div>

        <h1>Crie sua conta</h1>

        <div class="containerr">

          <div class="inputs">
            <div class="Nome">
              <label for="name">Nome:</label>
              <div class="input">
                <img src="../assets/create-account-screen/Name.svg" alt="" />
                <input id="name" type="text" placeholder="Insira o seu nome" />
              </div>
            </div>

            <div class="inputEmail">
              <label for="email">Email:</label>
              <div class="input">
                <img src="../assets/create-account-screen/Email.svg" alt="" />
                <input id="email" type="email" placeholder="Insira o seu email" />
              </div>
            </div>

            <div>
              <label for="password">Senha:</label>
              <div class="input">
                <img src="../assets/create-account-screen/Lock.svg" alt="" />
                <input id="password" type="password" placeholder="Insira a sua senha" />
              </div>
            </div>

            <div>
              <label for="confirm-password">Confirmar senha:</label>
              <div class="input">
                <img src="../assets/create-account-screen/Lock.svg" alt="" />
                <input id="confirm-password" type="password" placeholder="Confirme a sua senha" />
                
              </div>
            </div>
          </div>

          <div class="btoes">
            <button>Criar Conta</button>
            <button class="btnverde">Ja tenho uma conta</button>
          </div>

        </div>
      </form>
    </main>
  </body>
</html>
